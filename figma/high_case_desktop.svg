nt-size="56" font-weight="800" letter-spacing="0" x="67" y="265">Blood Group</text><text fill="#15283C" font-family="Arial" font-size="56" font-weight="800" letter-spacing="0" x="67" y="334">Detection AI</text><text fill="#61758A" font-family="Arial" font-size="18" font-weight="400" letter-spacing="0" x="67" y="374">Exploring fingerprint features for experimental blood-group</text><text fill="#61758A" font-family="Arial" font-size="18" font-weight="400" letter-spacing="0" x="67" y="401">classification. Not a replacement for verified medical testing.</text><rect fill="#15283C" height="276" rx="14" ry="14" stroke="none" stroke-width="1" width="465" x="900" y="115" /><path d="M 985,339 Q 967,151 1093,171 Q 1210,199 1187,340" fill="none" stroke="#91BDE6" stroke-width="3" /><path d="M 1002,339 Q 987,163 1087,184 Q 1188,199 1176,340" fill="none" stroke="#91BDE6" stroke-width="3" /><path d="M 1019,339 Q 1007,175 1081,197 Q 1166,199 1165,340" fill="none" stroke="#91BDE6" stroke-width="3" /><path d="M 1036,339 Q 1027,187 1075,210 Q 1144,199 1154,340" fill="none" stroke="#91BDE6" stroke-width="3" /><path d="M 1053,339 Q 1047,199 1069,223 Q 1122,199 1143,340" fill="none" stroke="#91BDE6" stroke-width="3" /><rect fill="#F8FAFC" height="617" rx="13" ry="13" stroke="#DCE5ED" stroke-width="1" width="220" x="67" y="503" /><text fill="#61758A" font-family="Arial" font-size="15" font-weight="700" letter-spacing="0" x="85" y="553">Overview</text><text fill="#61758A" font-family="Arial" font-size="15" font-weight="700" letter-spacing="0" x="85" y="626">Problem &amp; goal</text><text fill="#61758A" font-family="Arial" font-size="15" font-weight="700" letter-spacing="0" x="85" y="699">Approach</text><text fill="#61758A" font-family="Arial" font-size="15" font-weight="700" letter-spacing="0" x="85" y="772">System flow</text><text fill="#61758A" font-family="Arial" font-size="15" font-weight="700" letter-spacing="0" x="85" y="845">Decisions</text><text fill="#61758A" font-family="Arial" font-size="15" font-weight="700" letter-spacing="0" x="85" y="918">Next steps</text><text fill="#235A97" font-family="Arial" font-size="13" font-weight="800" letter-spacing="1.5" x="335" y="532">01 / OVERVIEW</text><text fill="#15283C" font-family="Arial" font-size="43" font-weight="800" letter-spacing="0" x="335" y="588">At a glance</text><text fill="#61758A" font-family="Arial" font-size="19" font-weight="400" letter-spacing="0" x="335" y="638">An exploratory project investigating whether fingerprint-image</text><text fill="#61758A" font-family="Arial" font-size="19" font-weight="400" letter-spacing="0" x="335" y="670">patterns can help predict a blood-group category in a study</text><text fill="#61758A" font-family="Arial" font-size="19" font-weight="400" letter-spacing="0" x="335" y="702">dataset. Validation is essential before making any claims.</text><rect fill="#F8FAFC" height="294" rx="13" ry="13" stroke="#DCE5ED" stroke-width="1" width="502" x="335" y="762" /><text fill="#235A97" font-family="Arial" font-size="13" font-weight="800" letter-spacing="0" x="363" y="811">THE CHALLENGE</text><text fill="#15283C" font-family="Arial" font-size="18" font-weight="400" letter-spacing="0" x="363" y="859">Blood typing is normally established</text><text fill="#15283C" font-family="Arial" font-size="18" font-weight="400" letter-spacing="0" x="363" y="891">with laboratory testing. Fingerprint-</text><text fill="#15283C" font-family="Arial" font-size="18" font-weight="400" letter-spacing="0" x="363" y="923">based prediction remains experimental.</text><rect fill="#F8FAFC" height="294" rx="13" ry="13" stroke="#DCE5ED" stroke-width="1" width="501" x="854" y="762" /><text fill="#235A97" font-family="Arial" font-size="13" font-weight="800" letter-spacing="0" x="882" y="811">PROJECT GOAL</text><text fill="#15283C" font-family="Arial" font-size="18" font-weight="400" letter-spacing="0" x="882" y="859">Investigate classification signals,</text><text fill="#15283C" font-family="Arial" font-size="18" font-weight="400" letter-spacing="0" x="882" y="891">quantify limitations and evaluate</text><text fill="#15283C" font-family="Arial" font-size="18" font-weight="400" letter-spacing="0" x="882" y="923">the model responsibly.</text></svg>